<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | Legacy Stories</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <span>✨</span> Legacy Stories
        </a>
        <nav>
            <ul>
                <li><a href="index.html">الرئيسية</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="form-card animate-fade" style="max-width: 400px;">
            <h2 style="margin-bottom: 2rem; text-align: center;">تسجيل دخول الإدارة</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" name="email" required placeholder="admin@example.com">
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" name="password" required placeholder="********">
                </div>

                <div style="text-align: center; margin-top: 2rem;">
                    <button type="submit" class="btn" style="width: 100%;">دخول</button>
                </div>
            </form>
            <p style="margin-top: 1rem; text-align: center; color: var(--text-muted); font-size: 0.9rem;">
                البيانات الافتراضية: admin@example.com / admin123
            </p>
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', handleLogin);
    </script>
</body>
</html>
