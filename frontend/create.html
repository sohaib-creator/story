<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة قصة جديدة | Legacy Stories</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <span>✨</span> Legacy Stories
        </a>
        <nav>
            <ul>
                <li><a href="index.html">الرئيسية</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="form-card animate-fade">
            <h2 style="margin-bottom: 2rem; text-align: center;">إضافة قصة جديدة</h2>
            <form id="create-story-form">
                <div class="form-group">
                    <label for="title">عنوان القصة</label>
                    <input type="text" id="title" name="title" required placeholder="أدخل عنوان القصة هنا...">
                </div>

                <div class="form-group">
                    <label for="category">القسم</label>
                    <select id="category" name="category">
                        <option value="تراث">تراث</option>
                        <option value="تاريخ">تاريخ</option>
                        <option value="سيرة ذاتية">سيرة ذاتية</option>
                        <option value="خيال">خيال</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="image">صورة القصة</label>
                    <input type="file" id="image" name="image" accept="image/*" required>
                </div>

                <div class="form-group">
                    <label for="excerpt">وصف مختصر</label>
                    <textarea id="excerpt" name="excerpt" rows="2" required placeholder="اكتب وصفاً موجزاً للقصة..."></textarea>
                </div>

                <div class="form-group">
                    <label for="content">المحتوى الكامل</label>
                    <textarea id="content" name="content" rows="10" required placeholder="اكتب أحداث القصة بالتفصيل هنا..."></textarea>
                </div>

                <div style="text-align: center; margin-top: 2rem;">
                    <button type="submit" class="btn" style="width: 100%;">نشر القصة الآن</button>
                </div>
            </form>
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        // Check if user is logged in
        if (!localStorage.getItem('user')) {
            window.location.href = 'login.html';
        }
        document.getElementById('create-story-form').addEventListener('submit', handleCreateStory);
    </script>
</body>
</html>
