<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل القصة | Legacy Stories</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <span>✨</span> Legacy Stories
        </a>
        <nav>
            <ul>
                <li><a href="index.html">الرئيسية</a></li>
            </ul>
        </nav>
        <a href="create.html" class="btn">إضافة قصة جديدة</a>
    </header>

    <main class="container">
        <div id="story-detail" class="animate-fade">
            <!-- Story details will be loaded here -->
            <div class="loading">جاري تحميل تفاصيل القصة...</div>
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        // Specific logic for single story view
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const storyId = urlParams.get('id');
            if (storyId) {
                fetchStoryDetail(storyId);
            }
        });
    </script>
</body>
</html>
