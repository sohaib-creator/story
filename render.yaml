services:
  - type: web
    name: legacy-stories
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: story-db
          property: connectionString

databases:
  - name: story-db
    plan: free
    databaseName: story
    user: postgres
